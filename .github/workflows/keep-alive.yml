name: keep-alive

# Render free web services sleep after 15 minutes without inbound traffic.
# GitHub's cron scheduler is unreliable, so this workflow runs a self-chaining
# ping loop (same pattern as the main bot's keep-alive).
#
# IMPORTANT: update the URL below if Render renames the service (e.g. adds a
# random suffix when "veltrix-ads" is taken).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # job limit; loop finishes well before this
    steps:
      - name: Ping health endpoint every 5 minutes for ~5 hours
        run: |
          URL="https://veltrix-ads.onrender.com/health"
          LOOP_MINUTES=300
          end=$((SECONDS + LOOP_MINUTES * 60))
          while [ $SECONDS -lt $end ]; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 60 "$URL" || true)
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') -> HTTP $code"
            sleep 300
          done

      - name: Chain the next run
        if: success() # never on cancellation, so chains do not multiply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-alive.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Next keep-alive run dispatched."
